<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr. Driller Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="480" height="640"></canvas>
    </div>

    <div id="controls">
        <div id="dpad">
            <div class="dpad-row">
                <button id="btn-up" class="control-btn">↑</button>
            </div>
            <div class="dpad-row">
                <button id="btn-left" class="control-btn">←</button>
                <button id="btn-right" class="control-btn">→</button>
            </div>
            <div class="dpad-row">
                <button id="btn-down" class="control-btn">↓</button>
            </div>
        </div>
        <button id="btn-dig" class="control-btn big-btn">DIG</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
